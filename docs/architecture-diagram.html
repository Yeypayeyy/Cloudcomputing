<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Inventory API Architecture</title>
<style>
  html,body{margin:0;background:#fff}
  svg{display:block;font-family:"Segoe UI",Arial,sans-serif}
  .t{font-size:15px;fill:#1f2937}
  .s{font-size:13px;fill:#4b5563}
  .m{font-family:Consolas,monospace;font-size:13px;fill:#1f2937}
  .h{font-size:17px;font-weight:700}
  .lbl{font-size:13px;font-weight:600}
  .hl{paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
</style></head>
<body>
<svg width="1800" height="1120" viewBox="0 0 1800 1120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="aReq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/></marker>
    <marker id="aRes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="aDep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="aIam" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>

  <!-- Title -->
  <text x="50" y="52" style="font-size:30px;font-weight:800;fill:#111827">Inventory API — Container Architecture (Track B)</text>
  <text x="50" y="82" class="s" style="font-size:16px">Amazon EC2 + Docker + Amazon ECR · Region us-east-1 · AWS Academy Lab (Microservices &amp; CI/CD)</text>

  <!-- Left actors -->
  <rect x="50" y="300" width="230" height="120" rx="14" fill="#eef2ff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="165" y="340" text-anchor="middle" class="h" fill="#1e3a8a">Client</text>
  <text x="165" y="365" text-anchor="middle" class="s">curl / Postman / browser</text>
  <text x="165" y="386" text-anchor="middle" class="s">(week 12: curl dari dalam EC2)</text>

  <rect x="50" y="520" width="230" height="110" rx="14" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="165" y="560" text-anchor="middle" class="h" fill="#111827">Admin / Developer</text>
  <text x="165" y="585" text-anchor="middle" class="s">EC2 Instance Connect</text>
  <text x="165" y="605" text-anchor="middle" class="s">(SSH port 22, via console)</text>

  <rect x="50" y="730" width="230" height="110" rx="14" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="165" y="770" text-anchor="middle" class="h" fill="#111827">GitHub repo (public)</text>
  <text x="165" y="795" text-anchor="middle" class="m">Yeypayeyy/Cloudcomputing</text>
  <text x="165" y="815" text-anchor="middle" class="s">app code + Dockerfile</text>

  <!-- AWS Cloud -->
  <rect x="350" y="120" width="1410" height="840" rx="18" fill="none" stroke="#111827" stroke-width="2.5"/>
  <rect x="350" y="120" width="230" height="40" rx="10" fill="#111827"/>
  <text x="465" y="146" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#fff">AWS Cloud · us-east-1</text>

  <!-- VPC -->
  <rect x="385" y="185" width="960" height="745" rx="16" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="405" y="214" class="lbl" fill="#7c3aed" style="font-size:15px">LabVPC (vpc-0e087582dd5a05aa6) · Internet Gateway</text>

  <!-- Subnet -->
  <rect x="415" y="232" width="900" height="672" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="435" y="260" class="lbl" fill="#15803d" style="font-size:15px">Public subnet · us-east-1a</text>

  <!-- Security group -->
  <rect x="445" y="278" width="840" height="600" rx="12" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="465" y="304" class="lbl" fill="#b91c1c" style="font-size:14px">Security group Ec2AppNodeSecurityGroup · inbound TCP 22 (SSH), 80 (HTTP) · port app 8080 tidak dibuka ke publik</text>

  <!-- EC2 -->
  <rect x="475" y="322" width="780" height="530" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="865" y="354" text-anchor="middle" class="h" fill="#c2410c" style="font-size:19px">Amazon EC2 · MonolithicAppServer</text>
  <text x="865" y="378" text-anchor="middle" class="s">t2.micro · Ubuntu 20.04 · Docker 26 · IAM role: none</text>

  <!-- Docker host label -->
  <rect x="500" y="395" width="730" height="300" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="515" y="417" class="s" style="font-weight:600;fill:#9a3412">Docker Engine · port mapping host → container</text>

  <!-- inventory-service container -->
  <rect x="520" y="432" width="340" height="245" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="690" y="462" text-anchor="middle" class="h" fill="#1d4ed8">Container: inventory-service</text>
  <text x="690" y="484" text-anchor="middle" class="s">Python 3.12 · Flask · gunicorn · user non-root</text>
  <text x="690" y="504" text-anchor="middle" class="s">host :8080 → container :5000</text>
  <text x="545" y="535" class="m">POST   /items</text>
  <text x="545" y="557" class="m">GET    /items</text>
  <text x="545" y="579" class="m">GET    /items/{itemId}</text>
  <text x="545" y="601" class="m">PUT    /items/{itemId}</text>
  <text x="545" y="623" class="m">DELETE /items/{itemId}</text>
  <text x="545" y="645" class="m">GET    /health</text>
  <text x="690" y="667" text-anchor="middle" class="s" style="font-weight:600;fill:#1e40af">entitas: Item</text>

  <!-- stock-service planned -->
  <rect x="890" y="432" width="320" height="245" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1050" y="462" text-anchor="middle" class="h" fill="#4b5563">Container: stock-service</text>
  <text x="1050" y="484" text-anchor="middle" class="s">(direncanakan, minggu berikutnya)</text>
  <text x="1050" y="504" text-anchor="middle" class="s">host :8081 → container :5000</text>
  <text x="915" y="540" class="m">POST /stock/in</text>
  <text x="915" y="562" class="m">POST /stock/out</text>
  <text x="915" y="584" class="m">GET  /stock/history</text>
  <text x="1050" y="620" text-anchor="middle" class="s">memanggil inventory-service</text>
  <text x="1050" y="640" text-anchor="middle" class="s">untuk update quantity</text>

  <!-- arrow stock -> inventory -->
  <line x1="888" y1="560" x2="864" y2="560" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aReq)"/>

  <!-- Volume -->
  <rect x="520" y="740" width="340" height="90" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="690" y="772" text-anchor="middle" class="h" fill="#854d0e">Docker volume: inventory-data</text>
  <text x="690" y="796" text-anchor="middle" class="s">SQLite /data/inventory.db (EBS-backed)</text>
  <text x="690" y="816" text-anchor="middle" class="s">data tetap ada saat container restart</text>
  <line x1="690" y1="678" x2="690" y2="736" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#aReq)" marker-start="url(#aReq)"/>
  <text x="700" y="712" class="s hl">read / write</text>

  <!-- ECR -->
  <rect x="1400" y="250" width="320" height="200" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="1560" y="286" text-anchor="middle" class="h" fill="#c2410c" style="font-size:19px">Amazon ECR</text>
  <text x="1560" y="309" text-anchor="middle" class="s">private repository</text>
  <text x="1560" y="342" text-anchor="middle" class="m" style="font-size:15px">inventory-service:v1</text>
  <text x="1560" y="366" text-anchor="middle" class="s">stock-service (direncanakan)</text>
  <text x="1560" y="396" text-anchor="middle" class="s">enkripsi at rest AES-256</text>
  <text x="1560" y="418" text-anchor="middle" class="s">tag mutable · 49.83 MB</text>

  <!-- IAM -->
  <rect x="1400" y="560" width="320" height="210" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="1560" y="596" text-anchor="middle" class="h" fill="#b91c1c" style="font-size:19px">IAM: kredensial lab</text>
  <text x="1560" y="620" text-anchor="middle" class="s">voclabs session (sementara)</text>
  <text x="1560" y="648" text-anchor="middle" class="s">dipakai hanya untuk</text>
  <text x="1560" y="668" text-anchor="middle" class="s">ecr get-login-password + push/pull</text>
  <text x="1560" y="696" text-anchor="middle" class="s">dihapus dari server setelah dipakai</text>
  <text x="1560" y="716" text-anchor="middle" class="s">(rm ~/.aws/credentials, docker logout)</text>
  <text x="1560" y="744" text-anchor="middle" class="s">tidak ada access key di repo</text>

  <!-- Request flow: client -> EC2 container -->
  <path d="M280,345 L500,345 L520,470" fill="none" stroke="#1e3a8a" stroke-width="3" marker-end="url(#aReq)"/>
  <text x="300" y="335" class="lbl hl" fill="#1e3a8a">① HTTP request :8080</text>
  <path d="M520,520 L470,520 L470,395 L284,395" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#aRes)"/>
  <text x="300" y="413" class="lbl hl" fill="#0f766e">④ JSON 200/201/400/404/409</text>
  <text x="300" y="445" class="s hl" style="fill:#1e3a8a">② validasi input → ③ SQLite</text>

  <!-- Admin -> EC2 -->
  <path d="M280,575 L475,575" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#aReq)"/>
  <text x="298" y="565" class="lbl hl" fill="#374151">SSH :22</text>

  <!-- GitHub -> EC2 : git clone -->
  <path d="M280,785 L475,785" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#aDep)"/>
  <text x="298" y="775" class="lbl hl" fill="#c2410c">a. git clone</text>
  <text x="298" y="805" class="s hl" style="fill:#c2410c">b. docker build</text>

  <!-- EC2 -> ECR push -->
  <path d="M1255,345 L1398,320" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#aDep)"/>
  <text x="1268" y="318" class="lbl hl" fill="#c2410c">c. docker push</text>
  <!-- ECR -> EC2 pull -->
  <path d="M1398,400 L1257,420" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#aDep)"/>
  <text x="1268" y="438" class="lbl hl" fill="#c2410c">d. docker pull &amp; run</text>

  <!-- IAM -> EC2 auth -->
  <path d="M1398,665 L1257,665" fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#aIam)"/>
  <text x="1268" y="655" class="lbl hl" fill="#b91c1c">auth ECR</text>
  <path d="M1560,558 L1560,452" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#aIam)"/>
  <text x="1570" y="510" class="s hl" style="fill:#b91c1c">akses repo</text>

  <!-- Legend -->
  <rect x="50" y="985" width="1710" height="115" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="75" y="1015" class="lbl" style="font-size:15px;fill:#111827">Legenda &amp; catatan keamanan</text>
  <line x1="75" y1="1045" x2="135" y2="1045" stroke="#1e3a8a" stroke-width="3" marker-end="url(#aReq)"/><text x="145" y="1050" class="t">request</text>
  <line x1="245" y1="1045" x2="305" y2="1045" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#aRes)"/><text x="315" y="1050" class="t">response</text>
  <line x1="425" y1="1045" x2="485" y2="1045" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#aDep)"/><text x="495" y="1050" class="t">build / deploy</text>
  <line x1="635" y1="1045" x2="695" y2="1045" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#aIam)"/><text x="705" y="1050" class="t">IAM / auth</text>
  <rect x="820" y="1032" width="44" height="26" rx="5" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="875" y="1050" class="t">komponen yang direncanakan</text>
  <text x="75" y="1083" class="s" style="font-size:14px">• Lab memblokir pembuatan instance &amp; IAM role baru → instance lab dipakai ulang  • Kredensial sementara dihapus setelah push  • ECR privat  • Container jalan sebagai non-root  • Port 8080 hanya diakses dari dalam instance</text>
</svg>
</body></html>
