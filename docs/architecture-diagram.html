<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Arsitektur Inventory API</title>
<style>
  html,body{margin:0;background:#fff}
  svg{display:block;font-family:"Segoe UI",Arial,sans-serif}
  .t{font-size:15px;fill:#111827}
  .s{font-size:13px;fill:#4b5563}
  .m{font-family:Consolas,monospace;font-size:13px;fill:#111827}
  .h{font-size:16px;font-weight:700;fill:#111827}
  .b{font-size:13px;font-weight:600}
  .halo{paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
  .num{font-size:13px;font-weight:700;fill:#fff}
</style></head>
<body>
<svg width="1500" height="1060" viewBox="0 0 1500 1060" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>

  <text x="40" y="48" style="font-size:26px;font-weight:700;fill:#111827">Arsitektur Inventory API di AWS</text>
  <text x="40" y="76" class="s" style="font-size:15px">Track B: Amazon EC2 + Docker + Amazon ECR, region us-east-1, AWS Academy Lab</text>

  <!-- Outside actors -->
  <rect x="40" y="320" width="240" height="96" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="160" y="356" text-anchor="middle" class="h">Repositori GitHub</text>
  <text x="160" y="380" text-anchor="middle" class="m" style="font-size:12px">Yeypayeyy/Cloudcomputing</text>
  <text x="160" y="400" text-anchor="middle" class="s">kode, Dockerfile, skrip uji</text>

  <rect x="40" y="490" width="240" height="96" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="160" y="528" text-anchor="middle" class="h">Klien</text>
  <text x="160" y="552" text-anchor="middle" class="s">curl / Postman</text>
  <text x="160" y="572" text-anchor="middle" class="s">(minggu ini: curl dari dalam EC2)</text>

  <rect x="40" y="636" width="240" height="84" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="160" y="670" text-anchor="middle" class="h">Admin</text>
  <text x="160" y="694" text-anchor="middle" class="s">EC2 Instance Connect</text>

  <!-- AWS boundary -->
  <rect x="330" y="110" width="1130" height="690" rx="10" fill="#fafafa" stroke="#111827" stroke-width="2"/>
  <text x="350" y="138" class="b" style="font-size:15px;fill:#111827">AWS Cloud, region us-east-1</text>

  <rect x="365" y="160" width="745" height="620" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="383" y="186" class="b" style="fill:#374151">LabVPC (vpc-0e087582dd5a05aa6)</text>

  <rect x="395" y="200" width="685" height="560" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="413" y="224" class="b" style="fill:#4b5563">Public subnet us-east-1a</text>

  <rect x="425" y="240" width="625" height="500" rx="8" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="443" y="264" class="b" style="fill:#b91c1c">Security group: inbound hanya TCP 22 dan 80</text>

  <!-- EC2 -->
  <rect x="455" y="280" width="565" height="440" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <text x="475" y="308" class="h">EC2 MonolithicAppServer</text>
  <text x="475" y="328" class="s">t2.micro, Ubuntu 20.04, Docker 26, tanpa IAM role</text>

  <rect x="485" y="348" width="270" height="76" rx="6" fill="#fff" stroke="#b45309" stroke-width="1.5"/>
  <text x="620" y="378" text-anchor="middle" class="b" style="fill:#92400e">docker build</text>
  <text x="620" y="400" text-anchor="middle" class="m">inventory-service:v1</text>

  <rect x="485" y="460" width="290" height="235" rx="6" fill="#fff" stroke="#0f766e" stroke-width="2"/>
  <text x="630" y="490" text-anchor="middle" class="h">Container inventory-service</text>
  <text x="630" y="511" text-anchor="middle" class="s">Flask + gunicorn, user non-root</text>
  <text x="630" y="531" text-anchor="middle" class="s">port host 8080 ke container 5000</text>
  <text x="510" y="563" class="m">POST   /items</text>
  <text x="510" y="583" class="m">GET    /items</text>
  <text x="510" y="603" class="m">GET    /items/{itemId}</text>
  <text x="510" y="623" class="m">PUT    /items/{itemId}</text>
  <text x="510" y="643" class="m">DELETE /items/{itemId}</text>
  <text x="510" y="663" class="m">GET    /health</text>

  <rect x="830" y="525" width="170" height="104" rx="6" fill="#fff" stroke="#374151" stroke-width="1.5"/>
  <text x="915" y="555" text-anchor="middle" class="b" style="fill:#111827">Docker volume</text>
  <text x="915" y="576" text-anchor="middle" class="m" style="font-size:12px">inventory-data</text>
  <text x="915" y="598" text-anchor="middle" class="s">SQLite</text>
  <text x="915" y="616" text-anchor="middle" class="s">inventory.db</text>

  <!-- ECR -->
  <rect x="1160" y="320" width="270" height="130" rx="8" fill="#fff" stroke="#b45309" stroke-width="2"/>
  <text x="1295" y="352" text-anchor="middle" class="h">Amazon ECR (privat)</text>
  <text x="1295" y="378" text-anchor="middle" class="m">inventory-service:v1</text>
  <text x="1295" y="402" text-anchor="middle" class="s">enkripsi AES-256</text>
  <text x="1295" y="424" text-anchor="middle" class="s">tag image = versi rilis</text>

  <!-- Credentials -->
  <rect x="1160" y="560" width="270" height="150" rx="8" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
  <text x="1295" y="592" text-anchor="middle" class="h">Kredensial sesi lab</text>
  <text x="1295" y="616" text-anchor="middle" class="s">sementara (voclabs)</text>
  <text x="1295" y="642" text-anchor="middle" class="s">hanya untuk login ECR,</text>
  <text x="1295" y="662" text-anchor="middle" class="s">push, dan pull, lalu dihapus</text>
  <text x="1295" y="688" text-anchor="middle" class="s">tidak ada key di repo</text>

  <!-- Deploy arrows -->
  <path d="M280,368 L483,382" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#aD)"/>
  <circle cx="318" cy="350" r="11" fill="#b45309"/><text x="318" y="355" text-anchor="middle" class="num">1</text>
  <text x="336" y="355" class="b halo" style="fill:#92400e">git clone</text>

  <path d="M755,372 L1158,372" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#aD)"/>
  <circle cx="1078" cy="356" r="11" fill="#b45309"/><text x="1078" y="361" text-anchor="middle" class="num">2</text>
  <text x="1095" y="361" class="b halo" style="fill:#92400e">push</text>

  <path d="M1158,430 L777,490" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#aD)"/>
  <circle cx="1078" cy="458" r="11" fill="#b45309"/><text x="1078" y="463" text-anchor="middle" class="num">3</text>
  <text x="1095" y="476" class="b halo" style="fill:#92400e">pull &amp; run</text>

  <!-- Request arrows -->
  <path d="M280,520 L483,520" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#aR)"/>
  <circle cx="318" cy="504" r="11" fill="#0f766e"/><text x="318" y="509" text-anchor="middle" class="num">4</text>
  <text x="336" y="509" class="b halo" style="fill:#0f766e">HTTP :8080</text>

  <path d="M777,577 L828,577" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#aR)" marker-start="url(#aR)"/>
  <circle cx="803" cy="556" r="11" fill="#0f766e"/><text x="803" y="561" text-anchor="middle" class="num">5</text>

  <path d="M483,570 L282,570" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aR)"/>
  <circle cx="318" cy="590" r="11" fill="#0f766e"/><text x="318" y="595" text-anchor="middle" class="num">6</text>
  <text x="336" y="595" class="b halo" style="fill:#0f766e">respons JSON</text>

  <!-- Admin -->
  <path d="M280,678 L453,678" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#aG)"/>
  <text x="298" y="668" class="b halo" style="fill:#374151">SSH :22</text>

  <!-- IAM -->
  <path d="M1295,558 L1295,452" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#aI)"/>
  <text x="1305" y="510" class="b halo" style="fill:#b91c1c">autentikasi</text>

  <!-- Bottom panels -->
  <rect x="40" y="830" width="880" height="190" rx="8" fill="#fff" stroke="#d1d5db"/>
  <text x="60" y="860" class="h">Urutan langkah</text>
  <text x="60" y="888" class="t"><tspan style="fill:#b45309;font-weight:700">Deploy</tspan>  1 kode di-clone ke EC2 dan di-build jadi image,  2 image di-push ke ECR,</text>
  <text x="60" y="912" class="t">3 container dijalankan dari image ECR dengan volume <tspan class="m">inventory-data</tspan>.</text>
  <text x="60" y="944" class="t"><tspan style="fill:#0f766e;font-weight:700">Request</tspan>  4 klien memanggil port 8080,  5 aplikasi memvalidasi input lalu membaca/menulis</text>
  <text x="60" y="968" class="t">SQLite,  6 aplikasi membalas JSON (200, 201, 400, 404, atau 409).</text>
  <text x="60" y="1000" class="s">Garis putus-putus oranye: deploy. Garis hijau: request. Garis merah: autentikasi. Kotak merah putus-putus: security group.</text>

  <rect x="940" y="830" width="520" height="190" rx="8" fill="#fff" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="960" y="860" class="h">Tahap berikutnya (belum dibangun)</text>
  <text x="960" y="890" class="t">stock-service di port 8081: mencatat barang</text>
  <text x="960" y="912" class="t">masuk/keluar, memanggil inventory-service</text>
  <text x="960" y="934" class="t">untuk mengubah quantity.</text>
  <text x="960" y="966" class="t">Lalu pindah ke ECS Fargate + ALB, SQLite</text>
  <text x="960" y="988" class="t">diganti RDS, build otomatis via CodePipeline.</text>
</svg>
</body></html>
